components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        enum: [10, 20, 50, 100]
        default: 20
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: createdAt,desc
      description: 仅允许端点声明的白名单字段
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: 相同用户、方法、路径和请求体在有效期内复用首次结果
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MenuId:
      name: menuId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ApplicationId:
      name: applicationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    NoticeId:
      name: noticeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    LogId:
      name: logId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未认证或会话失效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 权限不足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在或对当前用户不可见
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 资源版本、状态、唯一性或幂等冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: 请求格式正确但不满足业务规则
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: 请求频率过高
      headers:
        Retry-After:
          schema:
            type: integer
          description: 建议重试等待秒数
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: 文件超过大小限制
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedMediaType:
      description: 文件类型不支持
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: 外部依赖暂不可用，例如阿里云 OSS 无法访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Id:
      type: string
      pattern: '^[1-9][0-9]*$'
      example: '10001'
    EnabledStatus:
      type: string
      enum: [ENABLED, DISABLED]
    Gender:
      type: string
      enum: [MALE, FEMALE, UNSPECIFIED]
    Urgency:
      type: string
      enum: [NORMAL, URGENT]
    LeaveType:
      type: string
      enum: [ANNUAL, PERSONAL, SICK, MARRIAGE, MATERNITY, COMPENSATORY, OTHER]
    LeaveStatus:
      type: string
      enum: [DRAFT, PENDING, APPROVED, REJECTED, WITHDRAWN]
    ApprovalTaskStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, TRANSFERRED, CANCELLED]
    ApprovalAction:
      type: string
      enum: [CREATE, SUBMIT, APPROVE, REJECT, TRANSFER, WITHDRAW, RESUBMIT]
    NoticeType:
      type: string
      enum: [COMPANY, POLICY, EVENT, URGENT]
    NoticeStatus:
      type: string
      enum: [DRAFT, PUBLISHED, WITHDRAWN]
    NoticeScopeType:
      type: string
      enum: [ALL, DEPARTMENTS]
    NotificationType:
      type: string
      enum:
        - APPROVAL_PENDING
        - APPROVAL_APPROVED
        - APPROVAL_REJECTED
        - APPROVAL_TRANSFERRED
        - APPLICATION_WITHDRAWN
        - NOTICE_PUBLISHED
        - SYSTEM
    MenuType:
      type: string
      enum: [DIRECTORY, MENU, BUTTON]
    DataScope:
      type: string
      enum: [ALL, DEPARTMENT, DEPARTMENT_AND_CHILDREN, SELF, CUSTOM]
    FileStatus:
      type: string
      enum: [TEMPORARY, BOUND]
    OperationResult:
      type: string
      enum: [SUCCESS, FAILURE]
    ErrorDetail:
      type: object
      required: [reason]
      properties:
        field:
          type: string
          nullable: true
        reason:
          type: string
    ErrorResponse:
      type: object
      required: [code, message, requestId, timestamp]
      properties:
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
          example: 请求参数校验失败
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        requestId:
          type: string
          example: req_01K1ABCDEF
        timestamp:
          type: string
          format: date-time
    ResponseMeta:
      type: object
      required: [code, message, requestId, timestamp]
      properties:
        code:
          type: string
          enum: [OK]
        message:
          type: string
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    VersionRequest:
      type: object
      required: [version]
      properties:
        version:
          type: integer
          minimum: 1
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 6
          maxLength: 128
          writeOnly: true
        rememberMe:
          type: boolean
          default: false
    TokenData:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresIn:
          type: integer
          minimum: 1
          description: 访问令牌剩余有效秒数
          example: 28800
