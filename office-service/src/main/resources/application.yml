server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: office-service
  datasource:
    url: ${OFFICE_DB_URL:jdbc:mysql://mysql:3306/redblack_office?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${OFFICE_DB_USERNAME}
    password: ${OFFICE_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

redblack:
  oss:
    region: ${OSS_REGION:}
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    prefix: ${OSS_PREFIX:redblack/v1/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

