server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: office-service
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  datasource:
    url: ${OFFICE_DB_URL:jdbc:mysql://mysql:3306/redblack_office?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${OFFICE_DB_USERNAME}
    password: ${OFFICE_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: redblack-office-v1
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

redblack:
  security:
    issuer: ${JWT_ISSUER:https://identity.redblack.local}
    audience: ${JWT_AUDIENCE:redblack-oa}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    internal-secret: ${INTERNAL_SERVICE_TOKEN_SECRET:}
    identity-internal-url: ${IDENTITY_SERVICE_URL:http://identity-service:8080}
    identity-connect-timeout: ${IDENTITY_CONNECT_TIMEOUT:1s}
    identity-response-timeout: ${IDENTITY_RESPONSE_TIMEOUT:3s}
    approval-internal-url: ${APPROVAL_SERVICE_URL:http://approval-service:8080}
    approval-connect-timeout: ${APPROVAL_CONNECT_TIMEOUT:1s}
    approval-response-timeout: ${APPROVAL_RESPONSE_TIMEOUT:3s}
  events:
    approval-topic: redblack.approval.events.v1
    office-topic: redblack.office.events.v1
    audit-topic: redblack.audit.events.v1
    dead-letter-topic: redblack.office.events.dlq.v1
  cache:
    workbench-ttl: ${WORKBENCH_CACHE_TTL:60s}
  file:
    temporary-ttl: ${TEMPORARY_FILE_TTL:24h}
    cleanup-delay: ${FILE_CLEANUP_DELAY:3600000}
  oss:
    region: ${OSS_REGION:}
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    prefix: ${OSS_PREFIX:redblack/v1/}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

