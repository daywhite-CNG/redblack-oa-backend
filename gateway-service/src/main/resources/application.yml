server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway-service
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service
              uri: ${IDENTITY_SERVICE_URL:http://identity-service:8080}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/account/**,/api/v1/users/**,/api/v1/departments/**,/api/v1/roles/**,/api/v1/menus/**
            - id: approval-service
              uri: ${APPROVAL_SERVICE_URL:http://approval-service:8080}
              predicates:
                - Path=/api/v1/leave-applications/**,/api/v1/approval-tasks/**
            - id: office-service
              uri: ${OFFICE_SERVICE_URL:http://office-service:8080}
              predicates:
                - Path=/api/v1/workbench,/api/v1/notices/**,/api/v1/notifications/**,/api/v1/files/**
            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://audit-service:8080}
              predicates:
                - Path=/api/v1/operation-logs/**

redblack:
  security:
    issuer: ${JWT_ISSUER:https://identity.redblack.local}
    audience: ${JWT_AUDIENCE:redblack-oa}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    internal-secret: ${INTERNAL_SERVICE_TOKEN_SECRET:}
    identity-internal-url: ${IDENTITY_SERVICE_URL:http://identity-service:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

