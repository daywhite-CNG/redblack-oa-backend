server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DB_URL:jdbc:mysql://mysql:3306/redblack_audit?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${AUDIT_DB_USERNAME}
    password: ${AUDIT_DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    consumer:
      group-id: redblack-audit-v1
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record

mybatis-plus:
  global-config:
    banner: false
  configuration:
    map-underscore-to-camel-case: true

redblack:
  security:
    issuer: ${JWT_ISSUER:https://identity.redblack.local}
    audience: ${JWT_AUDIENCE:redblack-oa}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:}
    internal-secret: ${INTERNAL_SERVICE_TOKEN_SECRET:}
    identity-internal-url: ${IDENTITY_SERVICE_URL:http://identity-service:8080}
    identity-connect-timeout: ${IDENTITY_CONNECT_TIMEOUT:1s}
    identity-response-timeout: ${IDENTITY_RESPONSE_TIMEOUT:3s}
  events:
    audit-topic: redblack.audit.events.v1
    dead-letter-topic: redblack.audit.events.dlq.v1

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

